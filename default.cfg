; ThunderboltNet — global defaults (Unraid Default / first install → ThunderboltNet.cfg)
; Live: /boot/config/plugins/ThunderboltNet/ThunderboltNet.cfg
;
; Product: host-to-host Thunderbolt/USB4 net (one or more peers). Addressing on per-iface tbnN cfgs.

; Driver options (shown on overview)
load_modules="yes"
e2e_flow_control="no"
; USB4STREAM raw path (thunderbolt_stream) — only loads if kernel has the module (~7.2+)
enable_usb4stream="no"

; Address plan for new/Reset tbn tabs: small-lan (/24) | p2p (/30) | custom
address_plan="small-lan"

; Host-wide listening default for new peers (per-peer overrides in UI)
include_listening="no"

; Legacy global IP path (unused by tbn tabs; manage_ip stays no)
manage_ip="no"
ip_addr="10.255.0.2"
ip_cidr="24"
ip_gateway=""
never_default="yes"

; Preferred iface names (hints only)
iface_primary="thunderbolt0"
iface_secondary="thunderbolt1"

; Legacy global bond keys (bonding is per-iface / experimental; leave off)
bond_enable="no"
bond_name="bond-tb0"
bond_mode="active-backup"

; Space-separated warning keys user chose to hide
ignore_warnings=""

; OpenFabric / FRR — multi-host fabric (default on; degrades if FRR missing)
; See docs/routing-openfabric.md
; Package install is NOT done here — use companion plugin FabricRouting (ibigsnet/FabricRouting)
openfabric_enable="yes"
openfabric_auto_install_frr="yes"
openfabric_ipv6="yes"
openfabric_area="1"
; Empty router_id / net = auto
openfabric_router_id=""
openfabric_net=""
; Auto metric ≈ reference_mbps / trained_Mbps (ring path selection)
; Auto metric ≈ reference_mbps / trained_Mbps. Default 20000 = ~20 Gbit/s
; (typical Linux Thunderbolt host-net one-way class). Prefer manual metrics if you need
; a 40/80/100G path preferred over a 20G Thunderbolt hop (auto floors at 1).
openfabric_metric_reference_mbps="20000"

; Multi-host peer link check (Unraid plugins compare trained rates — private underlay only)
; Default on so the Peers column is useful; both hosts need the same mesh_token.
mesh_report="yes"
mesh_token=""
mesh_poll_secs="60"
mesh_stale_secs="300"
mesh_holdoff_secs="120"
mesh_private_only="yes"
; Optional space-separated non-Thunderbolt ifaces for mesh export (never br0/wlan)
mesh_eth_ifaces=""
; Optional space-separated peer IPv4s to poll (plus auto neigh on thunderbolt*)
mesh_peer_ips=""

; Reserved
tbn_defaults=""
