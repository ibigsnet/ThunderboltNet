; ThunderboltNet — defaults (Unraid Default button uses this)
; Live settings: /boot/config/plugins/ThunderboltNet/ThunderboltNet.cfg
;
; Product defaults: observe-only until you opt in to listening / static IPs.

tbn_defaults=""
load_modules="yes"
e2e_flow_control="no"
include_listening="no"
manage_ip="no"
ip_addr="10.255.1.2"
ip_cidr="24"
ip_gateway=""
never_default="yes"
iface_primary="thunderbolt0"
iface_secondary="thunderbolt1"
bond_enable="no"
bond_name="bond-tb0"
bond_mode="balance-rr"
ignore_warnings=""
