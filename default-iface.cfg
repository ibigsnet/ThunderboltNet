; Default per-iface settings (reference template for thunderbolt0-class link).
; Runtime Reset / first create uses tbn_iface_defaults($if) in PHP, which sets
; IPADDR to 10.255.N.2 for thunderboltN (not a fixed .0.2 for every N).

DESCRIPTION=""
ENABLE="yes"
BONDING="no"
BONDING_MODE="active-backup"
BOND_NAME="bond-tb0"
BOND_MEMBERS=""
BRIDGING="no"
BR_NAME="br-tb0"
VLAN_ENABLE="no"
VLAN_LIST=""
PROTOCOL="ipv4"
USE_DHCP="no"
ADDRESS_PLAN="small-lan"
IPADDR="10.255.0.2"
NETMASK="24"
GATEWAY=""
DEFAULT_ROUTE="no"
USE_DHCP6="no"
IPADDR6=""
NETMASK6="64"
GATEWAY6=""
DEFAULT_ROUTE6="no"
MTU_MODE="default"
MTU="9000"
USE_MTU="no"
INCLUDE_LISTENING="no"
OPENFABRIC_PARTICIPATE="yes"
OPENFABRIC_METRIC_MODE="auto"
OPENFABRIC_METRIC=""
